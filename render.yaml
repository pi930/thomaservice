services:
  - type: web
    name: thomaservice
    env: docker
    plan: free
    branch: master
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: APP_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: thomaservice-db
          property: connectionString

databases:
  - name: thomaservice-db
    plan: free
